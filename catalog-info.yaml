---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: backstage-catalog-root
  description: Root catalog for all entities
spec:
  targets:
    - ./components/*.yaml
    - ./systems/*.yaml
    - ./templates/github/create-repository-request-direct.yaml
    - ./templates/github/add-team-members/template.yaml
    - ./templates/dockerhub/*.yaml
    - ./templates/secrets/*.yaml
