---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-secret-access
  title: Request Secret Access
  description: Give an existing repository access to a shared secret.
  tags:
    - secrets
    - vault
    - self-service
spec:
  owner: group:eio
  type: service
  system: secrets-management

  parameters:
    - title: Repository
      required:
        - org
        - repoName
      properties:
        org:
          title: GitHub Organization
          type: string
          enum: [rancherlabs, rancher, rancher-eio, harvester, neuvector, rancher-sandbox]
          default: rancher
          ui:autofocus: true
        repoName:
          title: Repository Name
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]*$'

    - title: Secrets
      properties:
        secrets:
          title: Secrets
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            enum:
              - 'dockerhub/rancher:import-dockerhub-rancher'
              - 'rancher-prime-registry:import-rancher-suse-registry'
              - 'rancher-prime-registry:import-rancher-prime-harvester'
              - 'rancher-prime-stg-registry:import-rancher-prime-registry-stg'
              - 'rancher-prime-stg-registry:import-harvester-suse-registry-stg'
            enumNames:
              - 'DockerHub Registry'
              - 'Rancher Prime Registry'
              - 'Harvester Rancher Prime Registry'
              - 'Rancher Prime Staging Registry'
              - 'Harvester Rancher Prime Staging Registry'
          ui:widget: checkboxes

        otherSecret:
          title: Not listed?
          type: string
          description: Describe the secret you need and EIO will set it up.
          ui:widget: textarea
          ui:options:
            rows: 3

    - title: Additional Information
      properties:
        justification:
          title: Why does this repository need access?
          type: string
          ui:widget: textarea
          ui:options:
            rows: 3

  steps:
    - id: create-issue
      name: Creating issue for tracking
      action: github:issues:create
      input:
        repoUrl: github.com?repo=eio&owner=rancherlabs
        title: 'Secret Access Request: ${{ parameters.org }}/${{ parameters.repoName }}'
        body: |
          ## Secret Access Request

          **Repository:** `${{ parameters.org }}/${{ parameters.repoName }}`
          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

          ### Secrets
          {%- if parameters.secrets and parameters.secrets.length > 0 %}
          {% for secret in parameters.secrets %}
          - `${{ secret.split(':')[0] }}`
          {%- endfor %}
          {%- else %}
          _none from the list_
          {%- endif %}

          {%- if parameters.otherSecret %}

          ### Not listed
          - [ ] ${{ parameters.otherSecret }}
          {%- endif %}

          ### Justification
          ${{ parameters.justification }}
          {%- if parameters.secrets and parameters.secrets.length > 0 %}

          ---

          ### Reading these secrets

          Once the pull request is merged, follow the guide for each one:
          {% for secret in parameters.secrets %}
          {%- if secret == 'dockerhub/rancher:import-dockerhub-rancher' %}
          - [Docker Hub](https://backstage.rancher.engineering/docs/default/system/eio/vault-secrets/#docker-hub)
          {%- elif secret == 'rancher-prime-registry:import-rancher-suse-registry' %}
          - [Rancher Prime Registry](https://backstage.rancher.engineering/docs/default/system/eio/vault-secrets/#rancher-prime-registry)
          {%- elif secret == 'rancher-prime-registry:import-rancher-prime-harvester' %}
          - [Harvester Rancher Prime Registry](https://backstage.rancher.engineering/docs/default/system/eio/vault-secrets/#harvester-rancher-prime-registry)
          {%- elif secret == 'rancher-prime-stg-registry:import-rancher-prime-registry-stg' %}
          - [Rancher Prime Staging Registry](https://backstage.rancher.engineering/docs/default/system/eio/vault-secrets/#rancher-prime-staging-registry)
          {%- elif secret == 'rancher-prime-stg-registry:import-harvester-suse-registry-stg' %}
          - [Harvester Rancher Prime Staging Registry](https://backstage.rancher.engineering/docs/default/system/eio/vault-secrets/#harvester-rancher-prime-staging-registry)
          {%- endif %}
          {%- endfor %}
          {%- endif %}
        labels:
          - backstage-request
          - secrets
          - resolution-automated

    - id: template-pushsecret
      name: Preparing PushSecret manifests
      each: ${{ parameters.secrets }}
      action: fetch:template
      input:
        url: ./content
        targetPath: ./manifests/secrets/resources/PushSecret
        values:
          filename: export-${{ parameters.org }}-${{ parameters.repoName }}-${{ each.value.split(':')[0].replace('/', '-') }}
          org: ${{ parameters.org }}
          repoName: ${{ parameters.repoName }}
          vaultPath: ${{ each.value.split(':')[0] }}
          source: ${{ each.value.split(':')[1] }}
          requestedBy: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}
          issueNumber: ${{ steps['create-issue'].output.issueNumber }}

    - id: create-pr
      name: Submitting PR for review
      if: ${{ parameters.secrets.length > 0 }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=internal-production&owner=rancher-eio
        branchName: secret-access/${{ parameters.org }}-${{ parameters.repoName }}
        title: 'Secret Access: ${{ parameters.org }}/${{ parameters.repoName }}'
        description: |
          ## Secret Access Request

          **Tracking issue:** rancherlabs/eio#${{ steps['create-issue'].output.issueNumber }}

          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

          ### Summary
          - **Repository:** `${{ parameters.org }}/${{ parameters.repoName }}`
          - **Secrets:** ${{ parameters.secrets.length }}

          ### Justification
          ${{ parameters.justification }}

    - id: link-pr
      name: Linking the pull request to the issue
      if: ${{ parameters.secrets.length > 0 }}
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=internal-production&owner=rancher-eio
        workflowId: link-pr-to-issue.yaml
        branchOrTagName: main
        workflowInputs:
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}
          prUrl: ${{ steps['create-pr'].output.remoteUrl }}
          summary: Adds the PushSecret manifests that give `${{ parameters.org }}/${{ parameters.repoName }}` access to the requested secrets.

    - id: label-manual-secret
      name: Adding label for secret creation
      if: ${{ parameters.otherSecret }}
      action: github:issues:label
      input:
        repoUrl: github.com?repo=eio&owner=rancherlabs
        number: ${{ steps['create-issue'].output.issueNumber }}
        labels:
          - needs-manual-secret

    - id: request-vault-role
      name: Requesting Vault role for secrets access
      if: ${{ parameters.secrets.length > 0 }}
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=internal-production&owner=rancher-eio
        workflowId: add-vault-role-and-policy.yaml
        branchOrTagName: main
        returnWorkflowRunDetails: true
        workflowInputs:
          org: ${{ parameters.org }}
          repo: ${{ parameters.repoName }}
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}

  output:
    text:
      - title: Secret Request Submitted!
        content: |
          ✅ **Request Created**

          Your secret access request for `${{ parameters.org }}/${{ parameters.repoName }}` is being processed.

          **Next steps:**
          1. EIO team review (1-3 days)
          2. Secrets available (~5 min after merge)

          All updates will be posted to the tracking issue below.

    links:
      - title: View Pull Request
        icon: github
        url: ${{ steps['create-pr'].output.remoteUrl or 'https://github.com/rancher-eio/internal-production/pulls' }}

      - title: View Vault Role Workflow
        icon: dashboard
        url: ${{ steps['request-vault-role'].output.workflowRunHtmlUrl or 'https://github.com/rancher-eio/internal-production/actions/workflows/add-vault-role-and-policy.yaml' }}

      - title: Track Request
        icon: github
        url: ${{ steps['create-issue'].output.issueUrl }}
