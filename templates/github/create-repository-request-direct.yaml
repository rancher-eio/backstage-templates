---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-repository-request-direct
  title: Create a GitHub Repository (Direct)
  description: Set up a repository with the right team access. Creates PR directly to internal-production.
  tags:
    - github
    - repository
    - self-service
spec:
  owner: group:eio
  type: service
  system: github-management

  parameters:
    - title: Repository Details
      required:
        - org
        - name
      properties:
        org:
          title: GitHub Organization
          type: string
          description: Which org should this repo be created in?
          enum: [rancherlabs, rancher, rancher-eio, harvester, neuvector, rancher-sandbox]
          default: rancherlabs
          ui:autofocus: true

        name:
          title: Repository Name
          type: string
          description: Name of the repository (without org prefix)
          pattern: '^[a-z0-9][a-z0-9._-]*$'
          ui:help: Lowercase letters, numbers, dots, hyphens and underscores only

        create:
          title: Create the repository
          type: boolean
          default: true
          description: >-
            Untick if the repository already exists and you only want to manage
            its access and branch protection.

      dependencies:
        create:
          oneOf:
            - properties:
                create:
                  enum: [true]
                visibility:
                  title: Visibility
                  type: string
                  description: Who can see this repository?
                  enum: [private, public, internal]
                  default: private
                description:
                  title: Description
                  type: string
              required: [visibility]

            - properties:
                create:
                  enum: [false]

    - title: Access
      description: Collaborators must already be members of the org.
      properties:
        teams:
          title: Team Access
          type: array
          default: []
          items:
            type: object
            required: [slug, permission]
            properties:
              slug:
                title: Team
                type: string
                pattern: '^[a-z0-9][a-z0-9-]*$'
                ui:help: 'Team slug, e.g. eio'
              permission:
                title: Permission
                type: string
                enum: [pull, triage, push, maintain, admin]
                default: pull

        collaborators:
          title: Individual Collaborators
          type: array
          default: []
          items:
            type: object
            required: [username, permission]
            properties:
              username:
                title: GitHub Username
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$'
              permission:
                title: Permission
                type: string
                enum: [pull, triage, push, maintain, admin]
                default: pull

    - title: Branch Protection
      description: Full control over GitHub branch protection rulesets. Leave empty to use your org's default.
      properties:
        protectedBranches:
          title: Protected Branches
          type: array
          default: []
          items:
            type: string
          ui:help: 'Branch names, without refs/heads/. e.g. main'

      dependencies:
        protectedBranches:
          oneOf:
            - properties:
                protectedBranches:
                  minItems: 1
                rulesetName:
                  title: Ruleset Name
                  type: string
                  default: main
                  description: Name for the ruleset in GitHub
                enforcement:
                  title: Enforcement Mode
                  type: string
                  enum: [active, evaluate, disabled]
                  default: active
                  description: 'active: enforce rules, evaluate: dry-run only, disabled: off'
                requiredApprovals:
                  title: Required Approvals
                  type: integer
                  default: 0
                  minimum: 0
                  maximum: 10
                  description: Approvals needed before a pull request can be merged
                requireSignatures:
                  title: Require Commit Signatures
                  type: boolean
                  default: false
                  description: Require commits to be signed (GPG/SSH)

            - properties:
                protectedBranches:
                  maxItems: 0

    - title: Docker Hub
      description: Docker Hub repositories this repository pushes to.
      properties:
        dockerhub:
          title: Docker Hub Repositories
          type: array
          default: []
          items:
            type: object
            required: [namespace, name]
            properties:
              namespace:
                title: Docker Hub Organization
                type: string
                enum: [rancher, rancherlabs]
                default: rancher
              name:
                title: Repository
                type: string
                pattern: '^[a-z0-9][a-z0-9._-]*$'
              visibility:
                title: Visibility
                type: string
                enum: [public, private]
                default: private

    - title: Secrets
      description: Optional. Skip this if the repository doesn't need credentials.
      properties:
        secrets:
          title: Secrets
          description: >-
            Pick the account that matches your organization. Need one that isn't
            listed? Open an issue with EIO.
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            enum:
              - 'dockerhub/rancher:import-dockerhub-rancher'
              - 'rancher-prime-registry:import-rancher-suse-registry'
              - 'rancher-prime-registry:import-rancher-prime-harvester'
              - 'rancher-prime-stg-registry:import-rancher-prime-registry-stg'
              - 'rancher-prime-stg-registry:import-harvester-suse-registry-stg'
            enumNames:
              - 'DockerHub Registry'
              - 'Rancher Prime Registry — Rancher account'
              - 'Rancher Prime Registry — Harvester account'
              - 'Rancher Prime Staging Registry — Rancher account'
              - 'Rancher Prime Staging Registry — Harvester account'
          ui:widget: checkboxes

    - title: Additional Information
      properties:
        justification:
          title: Why do you need this repo?
          type: string
          ui:widget: textarea
          ui:options:
            rows: 3

  steps:
    - id: create-issue
      name: Creating issue for tracking
      action: github:issues:create
      input:
        repoUrl: github.com?repo=eio&owner=rancherlabs
        title: 'Create Repository Request: ${{ parameters.org }}/${{ parameters.name }}'
        body: |
          ## Create Repository Request

          **Repository:** `${{ parameters.org }}/${{ parameters.name }}`
          **Organization:** ${{ parameters.org }}
          **New repository:** ${{ parameters.create and 'yes' or 'no, adopting an existing one' }}
          **Visibility:** ${{ parameters.visibility and '`' + parameters.visibility + '`' or '_unchanged_' }}
          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

          ### Description
          ${{ parameters.description }}

          ### Requested Access
          **Teams:** `${{ parameters.teams | dump }}`
          **Collaborators:** `${{ parameters.collaborators | dump }}`

          ### Branch Protection
          **Branches:** ${{ parameters.protectedBranches | join(', ') or '_none_' }}
          **Ruleset name:** ${{ parameters.rulesetName or 'main' }}
          **Enforcement:** ${{ parameters.enforcement or 'active' }}
          **Required approvals:** ${{ parameters.requiredApprovals or 0 }}
          **Require signatures:** ${{ parameters.requireSignatures or false }}

          ### Docker Hub
          {%- if parameters.dockerhub and parameters.dockerhub.length > 0 %}
          {% for repo in parameters.dockerhub %}
          - [ ] `${{ repo.namespace }}/${{ repo.name }}` — ${{ repo.visibility or 'private' }}
          {%- endfor %}
          {%- else %}
          _none_
          {%- endif %}

          ### Secrets
          ${{ parameters.secrets | join(', ') or '_none_' }}

          ### Justification
          ${{ parameters.justification }}
        labels:
          - backstage-request
          - github
          - resolution-automated

    - id: label-dockerhub
      name: Adding label for Docker Hub repo creation
      if: ${{ parameters.dockerhub and parameters.dockerhub.length > 0 }}
      action: github:issues:label
      input:
        repoUrl: github.com?repo=eio&owner=rancherlabs
        number: ${{ steps['create-issue'].output.issueNumber }}
        labels:
          - needs-dockerhub

    - id: template-manifest
      name: Preparing RepositoryRequest manifest
      action: fetch:template
      input:
        url: ./content
        targetPath: ./manifests/resources/RepositoryRequest
        values:
          name: ${{ parameters.name }}
          org: ${{ parameters.org }}
          resourceName: ${{ (parameters.org == 'rancher') and (parameters.org + '--' + parameters.name) or parameters.name }}
          create: ${{ parameters.create }}
          visibility: ${{ parameters.visibility or 'private' }}
          description: ${{ parameters.description or '' }}
          teams: ${{ parameters.teams }}
          collaborators: ${{ parameters.collaborators }}
          protectedBranches: ${{ parameters.protectedBranches }}
          secrets: ${{ parameters.secrets }}
          rulesetName: ${{ parameters.rulesetName or 'main' }}
          enforcement: ${{ parameters.enforcement or 'active' }}
          requiredApprovals: ${{ parameters.requiredApprovals or 0 }}
          requireSignatures: ${{ parameters.requireSignatures or false }}
          issueNumber: ${{ steps['create-issue'].output.issueNumber }}
          requestedBy: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

    - id: create-pr
      name: Submitting PR for review
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=org&owner=${{ parameters.org }}
        branchName: repository-request/${{ parameters.name }}
        title: 'Create Repository: ${{ parameters.org }}/${{ parameters.name }}'
        description: |
          ## Create Repository Request

          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}
          **Tracking issue:** https://github.com/rancherlabs/eio/issues/${{ steps['create-issue'].output.issueNumber }}

          ### Summary
          - **Organization:** `${{ parameters.org }}`
          - **Repository:** `${{ parameters.name }}`
          - **Create:** ${{ parameters.create }}
          - **Visibility:** ${{ parameters.visibility or 'private' }}
          - **Teams:** ${{ parameters.teams.length or 0 }}
          - **Collaborators:** ${{ parameters.collaborators.length or 0 }}
          - **Secrets:** ${{ parameters.secrets.length or 0 }}
          - **Protected branches:** ${{ parameters.protectedBranches | join(', ') or 'none' }}
          - **Enforcement:** ${{ parameters.enforcement or 'active' }}
          - **Required approvals:** ${{ parameters.requiredApprovals or 0 }}
          - **Require signatures:** ${{ parameters.requireSignatures or false }}

          ### Justification
          ${{ parameters.justification }}

    - id: request-vault-role
      name: Requesting Vault role for secrets access
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=internal-production&owner=rancher-eio
        workflowId: add-vault-role-and-policy.yaml
        branchOrTagName: main
        returnWorkflowRunDetails: true
        workflowInputs:
          org: ${{ parameters.org }}
          repo: ${{ parameters.name }}
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}

  output:
    text:
      - title: Repository Request Submitted!
        content: |
          ✅ **Request Created**

          Your repository request for `${{ parameters.org }}/${{ parameters.name }}` is being processed.

          **Next steps:**
          1. Review the PR (link below)
          2. EIO team review (1-3 days)
          3. Resources ready (~5 min after merge)

          All updates will be posted to the tracking issue.

    links:
      - title: View Pull Request
        icon: github
        url: ${{ steps['create-pr'].output.remoteUrl }}

      - title: View Vault Role Workflow
        icon: dashboard
        url: ${{ steps['request-vault-role'].output.workflowRunHtmlUrl or 'https://github.com/rancher-eio/internal-production/actions/workflows/add-vault-role-and-policy.yaml' }}

      - title: Track Request
        icon: github
        url: ${{ steps['create-issue'].output.issueUrl }}
