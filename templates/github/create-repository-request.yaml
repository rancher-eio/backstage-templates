---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-repository-request
  title: Create a GitHub Repository
  description: Set up a repository with the right team access and secrets.
  tags:
    - github
    - repository
    - self-service
spec:
  owner: group:eio
  type: service
  system: github-management

  parameters:
    - title: Repository Details
      required:
        - org
        - name
      properties:
        org:
          title: GitHub Organization
          type: string
          description: Which org should this repo be created in?
          # Each org listed here needs add-repository-request.yaml in its `org` repo.
          enum: [rancherlabs, rancher, rancher-eio, harvester, neuvector, rancher-sandbox]
          default: rancherlabs
          ui:autofocus: true

        name:
          title: Repository Name
          type: string
          description: Name of the repository (without org prefix)
          pattern: '^[a-z0-9][a-z0-9._-]*$'
          ui:help: Lowercase letters, numbers, dots, hyphens and underscores only

        create:
          title: Create the repository
          type: boolean
          default: true
          description: >-
            Untick if the repository already exists and you only want to manage
            its access, branch protection and secrets.

      dependencies:
        create:
          oneOf:
            - properties:
                create:
                  enum: [true]
                visibility:
                  title: Visibility
                  type: string
                  description: Who can see this repository?
                  enum: [private, public, internal]
                  default: private
                description:
                  title: Description
                  type: string
              required: [visibility]

            - properties:
                create:
                  enum: [false]

    - title: Access
      description: Collaborators must already be members of the org.
      properties:
        teams:
          title: Team Access
          type: array
          default: []
          items:
            type: object
            required: [slug, permission]
            properties:
              slug:
                title: Team
                type: string
                pattern: '^[a-z0-9][a-z0-9-]*$'
                ui:help: 'Team slug, e.g. eio'
              permission:
                title: Permission
                type: string
                enum: [pull, triage, push, maintain, admin]
                default: pull

        collaborators:
          title: Individual Collaborators
          type: array
          default: []
          items:
            type: object
            required: [username, permission]
            properties:
              username:
                title: GitHub Username
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$'
              permission:
                title: Permission
                type: string
                enum: [pull, triage, push, maintain, admin]
                default: pull

    - title: Branch Protection
      description: Leave empty to use your org's default protection.
      properties:
        protectedBranches:
          title: Protected Branches
          type: array
          default: []
          items:
            type: string
          ui:help: 'Branch names, without refs/heads/. e.g. main'

      dependencies:
        protectedBranches:
          oneOf:
            - properties:
                protectedBranches:
                  minItems: 1
                requiredApprovals:
                  title: Required Approvals
                  type: integer
                  default: 0
                  minimum: 0
                  maximum: 10
                  description: Approvals needed before a pull request can be merged

            - properties:
                protectedBranches:
                  maxItems: 0

    - title: Secrets
      description: Optional. Skip this if the repository doesn't need credentials.
      properties:
        secrets:
          title: Secrets
          description: Need one that isn't listed? Open an issue with EIO.
          type: array
          default: []
          uniqueItems: true
          items:
            type: string
            enum:
              - 'dockerhub/rancher:import-dockerhub-rancher'
              - 'rancher-prime-registry:import-rancher-suse-registry'
              - 'rancher-prime-registry:import-rancher-prime-harvester'
              - 'rancher-prime-stg-registry:import-rancher-prime-registry-stg'
              - 'rancher-prime-stg-registry:import-harvester-suse-registry-stg'
            enumNames:
              - 'DockerHub Registry'
              - 'Rancher Prime Registry'
              - 'Harvester Rancher Prime Registry'
              - 'Rancher Prime Staging Registry'
              - 'Harvester Rancher Prime Staging Registry'
          ui:widget: checkboxes

    - title: Additional Information
      properties:
        justification:
          title: Why do you need this repo?
          type: string
          ui:widget: textarea
          ui:options:
            rows: 3

  steps:
    - id: create-issue
      name: Creating issue for tracking
      action: github:issues:create
      input:
        #repoUrl: github.com?repo=issues&owner=rancher-eio
        repoUrl: github.com?repo=eio&owner=rancherlabs
        title: 'Create Repository Request: ${{ parameters.org }}/${{ parameters.name }}'
        body: |
          ## Create Repository Request

          **Repository:** `${{ parameters.org }}/${{ parameters.name }}`
          **Organization:** ${{ parameters.org }}
          **New repository:** ${{ parameters.create and 'yes' or 'no, adopting an existing one' }}
          **Visibility:** ${{ parameters.visibility and '`' + parameters.visibility + '`' or '_unchanged_' }}
          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

          ### Description
          ${{ parameters.description }}

          ### Requested Access
          **Teams:** `${{ parameters.teams | dump }}`
          **Collaborators:** `${{ parameters.collaborators | dump }}`

          ### Branch Protection
          **Branches:** ${{ parameters.protectedBranches | join(', ') or '_none_' }}
          **Required approvals:** ${{ parameters.requiredApprovals }}

          ### Secrets
          ${{ parameters.secrets | join(', ') or '_none_' }}

          ### Justification
          ${{ parameters.justification }}
          {%- if parameters.secrets and parameters.secrets.length > 0 %}

          ---

          ### Reading these secrets

          Once the pull request is merged, follow the guide for each one:
          {% for secret in parameters.secrets %}
          {%- set vaultPath = secret.split(':')[0] %}
          {%- if vaultPath == 'dockerhub/rancher' %}
          - [Docker Hub](https://backstage.rancher.engineering/docs/default/component/internal-production/vault-secrets/#docker-hub)
          {%- elif vaultPath == 'rancher-prime-registry' %}
          - [Rancher Prime Registry](https://backstage.rancher.engineering/docs/default/component/internal-production/vault-secrets/#rancher-prime-registry)
          {%- elif vaultPath == 'rancher-prime-stg-registry' %}
          - [Rancher Prime Staging Registry](https://backstage.rancher.engineering/docs/default/component/internal-production/vault-secrets/#rancher-prime-staging-registry)
          {%- endif %}
          {%- endfor %}
          {%- endif %}
        labels:
          - backstage-request
          - github
          - resolution-automated

    - id: trigger-workflow
      name: Submitting PR for review
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=org&owner=${{ parameters.org }}
        # repoUrl: github.com?repo=testing&owner=rancher
        workflowId: add-repository-request.yaml
        branchOrTagName: main
        returnWorkflowRunDetails: true
        # Ten inputs is the workflow_dispatch limit, so requester and issue
        # travel together. Visibility falls back because the form hides it
        # when the repository already exists, and `choice` rejects an empty value.
        workflowInputs:
          name: ${{ parameters.name }}
          create: ${{ parameters.create | string }}
          visibility: ${{ parameters.visibility or 'private' }}
          description: ${{ parameters.description or '' }}
          teams: ${{ parameters.teams | dump }}
          collaborators: ${{ parameters.collaborators | dump }}
          secrets: ${{ parameters.secrets | join(',') }}
          protectedBranches: ${{ parameters.protectedBranches | join(',') }}
          requiredApprovals: ${{ parameters.requiredApprovals | string }}
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}

    - id: request-vault-role
      name: Requesting Vault role for secrets access
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=internal-production&owner=rancher-eio
        workflowId: add-vault-role-and-policy.yaml
        branchOrTagName: main
        returnWorkflowRunDetails: true
        workflowInputs:
          org: ${{ parameters.org }}
          repo: ${{ parameters.name }}
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}

  output:
    text:
      - title: Repository Request Submitted!
        content: |
          ✅ **Request Created**

          Your repository request for `${{ parameters.org }}/${{ parameters.name }}` is being processed.

          **You'll receive GitHub notifications at each stage:**
          1. PR created (~2 min)
          2. EIO team review (1-3 days)
          3. Resources ready (~5 min after merge)

          All updates will be posted to the tracking issue below.

    links:
      - title: View Repository Workflow
        icon: dashboard
        url: ${{ steps['trigger-workflow'].output.workflowRunHtmlUrl or 'https://github.com/' + parameters.org + '/org/actions/workflows/add-repository-request.yaml' }}

      - title: View Vault Role Workflow
        icon: dashboard
        url: ${{ steps['request-vault-role'].output.workflowRunHtmlUrl or 'https://github.com/rancher-eio/internal-production/actions/workflows/add-vault-role-and-policy.yaml' }}

      - title: Track Request
        icon: github
        url: ${{ steps['create-issue'].output.issueUrl }}
