---
apiVersion: eio.rancher.engineering/v1alpha1
kind: RepositoryRequest
metadata:
  name: ${{ values.resourceName }}
  {%- if values.requestedBy or values.issueNumber %}
  annotations:
    {%- if values.requestedBy %}
    github.eio.rancher.engineering/requested-by: "${{ values.requestedBy }}"
    {%- endif %}
    {%- if values.issueNumber %}
    github.eio.rancher.engineering/issue-number: "${{ values.issueNumber }}"
    {%- endif %}
  {%- endif %}
spec:
  org: ${{ values.org }}
  repoName: ${{ values.name }}
  {%- if values.create or values.visibility or values.description %}
  repository:
    {%- if values.create %}
    create: true
    {%- endif %}
    {%- if values.visibility %}
    visibility: ${{ values.visibility }}
    {%- endif %}
    {%- if values.description %}
    description: "${{ values.description }}"
    {%- endif %}
  {%- endif %}
  {%- if values.teams and values.teams.length > 0 %}
  teams:
  {%- for team in values.teams %}
  - slug: ${{ team.slug }}
    permission: ${{ team.permission }}
  {%- endfor %}
  {%- endif %}
  {%- if values.collaborators and values.collaborators.length > 0 %}
  collaborators:
  {%- for collaborator in values.collaborators %}
  - username: ${{ collaborator.username }}
    permission: ${{ collaborator.permission }}
  {%- endfor %}
  {%- endif %}
  {%- set hasBranches = values.protectedBranches and values.protectedBranches.length > 0 %}
  {%- set hasApprovals = values.requiredApprovals is defined and values.requiredApprovals !== null and values.requiredApprovals !== "" %}
  {%- set hasSignatures = values.requireSignatures is defined and values.requireSignatures !== null and values.requireSignatures !== "" %}
  {%- if hasBranches or values.rulesetName or values.enforcement or hasApprovals or hasSignatures %}
  branchProtection:
    {%- if hasBranches %}
    enabled: true
    {%- endif %}
    {%- if values.rulesetName %}
    name: ${{ values.rulesetName }}
    {%- endif %}
    {%- if hasBranches %}
    branches:
    {%- for branch in values.protectedBranches %}
    - ${{ branch }}
    {%- endfor %}
    {%- endif %}
    {%- if values.enforcement %}
    enforcement: ${{ values.enforcement }}
    {%- endif %}
    {%- if hasApprovals %}
    requiredApprovals: ${{ values.requiredApprovals }}
    {%- endif %}
    {%- if hasSignatures %}
    requireSignatures: ${{ values.requireSignatures }}
    {%- endif %}
  {%- endif %}
  {%- if values.secrets and values.secrets.length > 0 %}
  secrets:
  {%- for secret in values.secrets %}
  {%- set parts = secret.split(':') %}
  - vaultPath: ${{ parts[0] }}
    source: ${{ parts[1] }}
  {%- endfor %}
  {%- endif %}
