---
apiVersion: team.github.upbound.io/v1alpha1
kind: Team
metadata:
  name: ${{ values.resourceName }}
  {%- if values.requestedBy or values.issueNumber %}
  annotations:
    {%- if values.requestedBy %}
    github.eio.rancher.engineering/requested-by: "${{ values.requestedBy }}"
    {%- endif %}
    {%- if values.issueNumber %}
    github.eio.rancher.engineering/issue-number: "${{ values.issueNumber }}"
    {%- endif %}
  {%- endif %}
spec:
  deletionPolicy: Delete
  forProvider:
    name: ${{ values.team }}
    {%- if values.description %}
    description: ${{ values.description | dump }}
    {%- endif %}
    {%- if values.privacy %}
    privacy: ${{ values.privacy }}
    {%- endif %}
    {%- if values.parentTeam %}
    parentTeamId: ${{ values.parentTeam }}
    {%- endif %}
  providerConfigRef:
    name: ${{ values.org }}
