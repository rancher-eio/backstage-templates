---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: add-team-members
  title: GitHub Team
  description: Create a GitHub team, or add people to or edit an existing one.
  tags:
    - github
    - team
    - self-service
spec:
  owner: group:eio
  type: service
  system: github-management

  parameters:
    - title: Team Details
      description: Empty fields keep their current value.
      required:
        - org
        - team
      properties:
        org:
          title: GitHub Organization
          type: string
          enum: [rancherlabs, rancher, rancher-eio, harvester, neuvector, rancher-sandbox]
          default: rancherlabs
          ui:autofocus: true

        team:
          title: Team Name
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
          ui:field: GithubLookup
          ui:options:
            resource: teams
            allowNew: true
            createField: create

        create:
          title: Create the team
          type: boolean
          default: true
          description: Leave unticked for an existing team.

        description:
          title: Description
          type: string

        parentTeam:
          title: Parent Team
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
          ui:help: Optional. Team slug to nest this one under.
          ui:field: GithubLookup
          ui:options:
            resource: teams

    - title: Members
      description: Must already be org members.
      properties:
        members:
          title: Team Members
          type: array
          default: []
          items:
            type: object
            required: [username, role]
            properties:
              username:
                title: GitHub Username
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$'
                ui:field: GithubLookup
                ui:options:
                  resource: members
              role:
                title: Role
                type: string
                enum: [member, maintainer]
                default: member
                ui:help: 'maintainer can also manage the team''s members'

        usernames:
          title: Or paste usernames
          type: string
          pattern: '^[A-Za-z0-9@,\s-]*$'
          ui:field: GithubUsernames
          ui:options:
            rows: 2
          ui:help: Separated by spaces, commas or new lines.

        usernamesRole:
          title: Role for pasted usernames
          type: string
          enum: [member, maintainer]
          default: member

    - title: Additional Information
      properties:
        justification:
          title: Why is this needed?
          type: string
          ui:widget: textarea
          ui:options:
            rows: 3

  steps:
    - id: create-issue
      name: Creating issue for tracking
      action: github:issues:create
      input:
        repoUrl: github.com?repo=eio&owner=rancherlabs
        title: '${{ parameters.create and "Create Team" or ((parameters.description or parameters.parentTeam) and "Edit Team") or "Add Team Members" }} Request: ${{ parameters.org }}/${{ parameters.team }}'
        body: |
          ## ${{ parameters.create and "Create Team" or ((parameters.description or parameters.parentTeam) and "Edit Team") or "Add Team Members" }} Request

          **Team:** `${{ parameters.org }}/${{ parameters.team }}`
          {%- if parameters.create %}
          **New team:** yes
          **Description:** ${{ parameters.description or '_none_' }}
          **Parent team:** ${{ parameters.parentTeam or '_none_' }}
          {%- elif parameters.description or parameters.parentTeam %}
          **Settings change:** yes
          **Description:** ${{ parameters.description or '_unchanged_' }}
          **Parent team:** ${{ parameters.parentTeam or '_unchanged_' }}
          {%- endif %}
          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

          ### Members
          {%- set pasted = (parameters.usernames or '').match(r/[A-Za-z0-9][A-Za-z0-9-]*/g) or [] %}
          {%- set listed = (',' + ((parameters.members or []) | join(',', 'username')) + ',') | lower %}
          {%- if (parameters.members and parameters.members.length > 0) or pasted.length > 0 %}
          {%- for member in parameters.members or [] %}
          - `${{ member.username }}` (${{ member.role or 'member' }})
          {%- endfor %}
          {%- for username in pasted %}
          {%- if (',' + (username | lower) + ',') not in listed and pasted.indexOf(username) == loop.index0 %}
          - `${{ username }}` (${{ parameters.usernamesRole or 'member' }})
          {%- endif %}
          {%- endfor %}
          {%- else %}
          _none_
          {%- endif %}

          ### Justification
          ${{ parameters.justification or '_none_' }}
        labels:
          - backstage-request
          - github
          - resolution-automated

    - id: template-team
      name: Preparing Team manifest
      if: ${{ parameters.create or parameters.description or parameters.parentTeam }}
      action: fetch:template
      input:
        url: ./content/team
        targetPath: ./manifests/resources/Team
        values:
          org: ${{ parameters.org }}
          team: ${{ parameters.team }}
          description: ${{ parameters.description }}
          privacy: ${{ parameters.create and 'closed' or '' }}
          parentTeam: ${{ parameters.parentTeam }}
          resourceName: ${{ ((parameters.org == 'rancher') and ('rancher--' + parameters.team) or parameters.team) | lower }}
          requestedBy: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}
          issueNumber: ${{ steps['create-issue'].output.issueNumber }}

    - id: template-members
      name: Preparing TeamMembers manifest
      if: ${{ (parameters.members and parameters.members.length > 0) or (parameters.usernames and parameters.usernames.match(r/[A-Za-z0-9][A-Za-z0-9-]*/g)) }}
      action: fetch:template
      input:
        url: ./content/members
        targetPath: ./manifests/resources/TeamMembers
        values:
          org: ${{ parameters.org }}
          team: ${{ parameters.team }}
          members: ${{ parameters.members or [] }}
          pasted: ${{ (parameters.usernames or '').match(r/[A-Za-z0-9][A-Za-z0-9-]*/g) or [] }}
          pastedRole: ${{ parameters.usernamesRole or 'member' }}
          resourceName: ${{ ((parameters.org == 'rancher') and ('rancher--' + parameters.team) or parameters.team) | lower }}
          requestedBy: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}
          issueNumber: ${{ steps['create-issue'].output.issueNumber }}

    - id: create-pr
      name: Submitting PR for review
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=org&owner=${{ parameters.org }}
        branchName: ${{ (parameters.create or parameters.description or parameters.parentTeam) and "Team" or "TeamMembers" }}/${{ parameters.team }}-${{ steps['create-issue'].output.issueNumber }}
        update: true
        draft: true
        title: ':robot: ${{ parameters.create and "Create Team" or ((parameters.description or parameters.parentTeam) and "Edit Team") or "Add Team Members" }}: ${{ parameters.org }}/${{ parameters.team }}'
        description: |
          ## ${{ parameters.create and "Create Team" or ((parameters.description or parameters.parentTeam) and "Edit Team") or "Add Team Members" }} Request

          **Tracking issue:** rancherlabs/eio#${{ steps['create-issue'].output.issueNumber }}

          **Requested by:** @${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}

          ### Summary
          - **Organization:** `${{ parameters.org }}`
          - **Team:** `${{ parameters.team }}`
          {%- if parameters.create %}
          - **New team:** yes
          - **Description:** ${{ parameters.description or '_none_' }}
          - **Parent team:** ${{ parameters.parentTeam or '_none_' }}
          {%- elif parameters.description or parameters.parentTeam %}
          - **Settings change:** yes
          - **Description:** ${{ parameters.description or '_unchanged_' }}
          - **Parent team:** ${{ parameters.parentTeam or '_unchanged_' }}
          {%- endif %}

          ### Members
          {%- set pasted = (parameters.usernames or '').match(r/[A-Za-z0-9][A-Za-z0-9-]*/g) or [] %}
          {%- set listed = (',' + ((parameters.members or []) | join(',', 'username')) + ',') | lower %}
          {%- if (parameters.members and parameters.members.length > 0) or pasted.length > 0 %}
          {%- for member in parameters.members or [] %}
          - `${{ member.username }}` (${{ member.role or 'member' }})
          {%- endfor %}
          {%- for username in pasted %}
          {%- if (',' + (username | lower) + ',') not in listed and pasted.indexOf(username) == loop.index0 %}
          - `${{ username }}` (${{ parameters.usernamesRole or 'member' }})
          {%- endif %}
          {%- endfor %}
          {%- else %}
          _none_
          {%- endif %}

          ### Justification
          ${{ parameters.justification or '_none_' }}

    - id: merge-team
      name: Keeping existing team settings and members
      if: ${{ parameters.create or parameters.description or parameters.parentTeam or (parameters.members and parameters.members.length > 0) or (parameters.usernames and parameters.usernames.match(r/[A-Za-z0-9][A-Za-z0-9-]*/g)) }}
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=backstage-templates&owner=rancher-eio
        workflowId: merge-team-request.yaml
        branchOrTagName: main
        returnWorkflowRunDetails: true
        workflowInputs:
          pr: ${{ steps['create-pr'].output.remoteUrl }}
          path: ${{ (parameters.create or parameters.description or parameters.parentTeam) and ('manifests/resources/Team/' + (((parameters.org == 'rancher') and ('rancher--' + parameters.team) or parameters.team) | lower) + '.yaml') or '' }}
          members: ${{ ((parameters.members and parameters.members.length > 0) or (parameters.usernames and parameters.usernames.match(r/[A-Za-z0-9][A-Za-z0-9-]*/g))) and ('manifests/resources/TeamMembers/' + (((parameters.org == 'rancher') and ('rancher--' + parameters.team) or parameters.team) | lower) + '.yaml') or '' }}
          team: ${{ parameters.team }}
          create: ${{ parameters.create and 'yes' or 'no' }}
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}

    - id: link-pr
      name: Linking PR to the tracking issue
      action: github:actions:dispatch
      input:
        repoUrl: github.com?repo=internal-production&owner=rancher-eio
        workflowId: link-pr-to-issue.yaml
        branchOrTagName: main
        workflowInputs:
          tracking: ${{ user.entity.metadata.name or (user.ref | replace("user:default/", "")) or "unknown" }}:${{ steps['create-issue'].output.issueNumber }}
          prUrl: ${{ steps['create-pr'].output.remoteUrl }}
          summary: ${{ parameters.create and ("Creates `" + parameters.org + "/" + parameters.team + "`") or ((parameters.description or parameters.parentTeam) and ("Edits `" + parameters.org + "/" + parameters.team + "`")) or ("Updates `" + parameters.org + "/" + parameters.team + "`") }}${{ ((parameters.members and parameters.members.length > 0) or (parameters.usernames and parameters.usernames.match(r/[A-Za-z0-9][A-Za-z0-9-]*/g))) and " and adds team members" or "" }}.

  output:
    text:
      - title: Team Request Submitted!
        content: |
          ✅ **Request Created**

          Your request for `${{ parameters.org }}/${{ parameters.team }}` is being processed.

          **Next steps:**
          1. EIO team review (1-3 days)
          2. Changes applied (~5 min after merge)

          All updates will be posted to the tracking issue.

    links:
      - title: View Pull Request
        icon: github
        url: ${{ steps['create-pr'].output.remoteUrl }}

      - title: Track Request
        icon: github
        url: ${{ steps['create-issue'].output.issueUrl }}
