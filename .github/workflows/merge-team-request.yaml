---
name: merge-team-request
on:
  workflow_dispatch:
    inputs:
      pr:
        description: URL of the Team pull request Backstage opened
        required: true
        type: string
      path:
        description: Path of the Team manifest in that pull request
        required: true
        type: string
      team:
        description: Slug of the team in the request
        required: true
        type: string
      create:
        description: 'Whether the request asked to create the team, as yes or no'
        required: false
        type: string
        default: 'no'
      tracking:
        description: 'Requester and tracking issue, as username:issueNumber'
        required: false
        type: string

concurrency:
  group: merge-team-request-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  YAMLFMT_VERSION: 0.21.0
  MERGE: |
    load(strenv(OLD)) as $old |
    load(strenv(NEW)) as $new |
    $old
    | .metadata.annotations = ((.metadata.annotations // {}) * ($new.metadata.annotations // {}))
    | .spec.forProvider = (.spec.forProvider * ($new.spec.forProvider | del(.name)))

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate inputs
        id: inputs
        env:
          PR: ${{ inputs.pr }}
          MANIFEST: ${{ inputs.path }}
          TEAM: ${{ inputs.team }}
          TRACKING: ${{ inputs.tracking }}
        run: |
          case "${PR}" in
            https://github.com/*/org/pull/*) ;;
            *) echo "[FATAL] invalid pr" >&2; exit 1 ;;
          esac

          OWNER="${PR#https://github.com/}"
          OWNER="${OWNER%%/*}"
          NUMBER="${PR##*/}"

          case "${OWNER}" in
            harvester|neuvector|rancher|rancher-eio|rancher-sandbox|rancherlabs) ;;
            *) echo "[FATAL] invalid org" >&2; exit 1 ;;
          esac

          case "${NUMBER}" in
            ''|*[!0-9]*) echo "[FATAL] invalid pull request number" >&2; exit 1 ;;
          esac

          case "${MANIFEST}" in
            manifests/resources/Team/*.yaml) ;;
            *) echo "[FATAL] invalid path" >&2; exit 1 ;;
          esac

          case "${MANIFEST#manifests/resources/Team/}" in
            .*|*/*|*[!A-Za-z0-9._-]*) echo "[FATAL] invalid path" >&2; exit 1 ;;
          esac

          case "${TEAM}" in
            ''|-*|*[!a-z0-9-]*) echo "[FATAL] invalid team" >&2; exit 1 ;;
          esac

          case "${TRACKING}" in
            "") ;;
            *[!A-Za-z0-9:_-]*) echo "[FATAL] invalid tracking input" >&2; exit 1 ;;
          esac

          echo "owner=${OWNER}" >> "${GITHUB_OUTPUT}"
          echo "number=${NUMBER}" >> "${GITHUB_OUTPUT}"
          case "${TRACKING}" in
            *:*) echo "issue=${TRACKING##*:}" >> "${GITHUB_OUTPUT}" ;;
            *)   echo "issue="                >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Read GitHub App credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/rancher-eio/backstage-templates/github/app-credentials appId | APPID ;
            secret/data/github/repo/rancher-eio/backstage-templates/github/app-credentials privateKey | PRIVATEKEY

      - name: Generate token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.APPID }}
          private-key: ${{ env.PRIVATEKEY }}
          owner: ${{ steps.inputs.outputs.owner }}
          repositories: org

      - name: Generate token for the tracking issue
        id: eio-token
        if: ${{ steps.inputs.outputs.issue != '' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ env.APPID }}
          private-key: ${{ env.PRIVATEKEY }}
          owner: rancherlabs
          repositories: eio

      - name: Install yamlfmt
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar --extract --gzip --directory=/usr/local/bin yamlfmt

          printf 'formatter:\n  include_document_start: true\n  indentless_arrays: true\n' > "${RUNNER_TEMP}/yamlfmt.yaml"

      - name: Read the request and the team's current manifest
        id: read
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ steps.inputs.outputs.owner }}
          NUMBER: ${{ steps.inputs.outputs.number }}
          MANIFEST: ${{ inputs.path }}
          TEAM: ${{ inputs.team }}
          CREATE: ${{ inputs.create }}
        run: |
          REPO="${OWNER}/org"

          gh pr view "${NUMBER}" --repo "${REPO}" --json state,headRefName,headRefOid,baseRefName,isDraft > pr.json
          if [ "$(jq -r .state pr.json)" != "OPEN" ]; then
            echo "[FATAL] ${REPO}#${NUMBER} is not open" >&2
            exit 1
          fi

          HEAD="$(jq -r .headRefOid pr.json)"
          BASE="$(jq -r .baseRefName pr.json)"

          gh api -H "Accept: application/vnd.github.raw" "repos/${REPO}/contents/${MANIFEST}?ref=${HEAD}" > new.yaml

          if ! gh api "repos/${REPO}/contents/manifests/resources/Team?ref=${BASE}" > teams.json 2> fetch.err; then
            if ! grep -q "HTTP 404" fetch.err; then
              cat fetch.err >&2
              exit 1
            fi
            echo '[]' > teams.json
          fi

          OLD_PATH=""
          for FILE in $(jq -r '.[] | select(.type == "file" and (.name | test("\\.ya?ml$"))) | .path' teams.json); do
            gh api -H "Accept: application/vnd.github.raw" "repos/${REPO}/contents/${FILE}?ref=${BASE}" > candidate.yaml
            if [ "$(TEAM="${TEAM}" OWNER="${OWNER}" yq 'select(.kind == "Team" and .spec.forProvider.name == strenv(TEAM) and .spec.providerConfigRef.name == strenv(OWNER)) | "match"' candidate.yaml)" = "match" ]; then
              OLD_PATH="${FILE}"
              mv candidate.yaml old.yaml
              break
            fi
          done

          if [ -z "${OLD_PATH}" ] && [ "${CREATE}" = "yes" ]; then
            echo "New team, nothing to merge" >> "${GITHUB_STEP_SUMMARY}"
          elif [ -z "${OLD_PATH}" ]; then
            echo "[FATAL] ${OWNER}/${TEAM} is not managed in ${REPO} yet, so it has to be adopted before it can be edited" >&2
            exit 1
          fi

          [ -n "${OLD_PATH}" ] && echo "Merging into ${OLD_PATH}" >> "${GITHUB_STEP_SUMMARY}"
          echo "branch=$(jq -r .headRefName pr.json)" >> "${GITHUB_OUTPUT}"
          echo "head=${HEAD}" >> "${GITHUB_OUTPUT}"
          echo "draft=$(jq -r .isDraft pr.json)" >> "${GITHUB_OUTPUT}"
          echo "old_path=${OLD_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Merge
        if: ${{ steps.read.outputs.old_path != '' }}
        run: |
          OLD=old.yaml NEW=new.yaml yq --null-input "${MERGE}" > merged.yaml
          yamlfmt -conf "${RUNNER_TEMP}/yamlfmt.yaml" merged.yaml

      - name: Push the merged request
        if: ${{ steps.read.outputs.old_path != '' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ steps.inputs.outputs.owner }}
          MANIFEST: ${{ inputs.path }}
          OLD_PATH: ${{ steps.read.outputs.old_path }}
          BRANCH: ${{ steps.read.outputs.branch }}
          HEAD: ${{ steps.read.outputs.head }}
        run: |
          REPO="${OWNER}/org"

          OLD_BLOB="$(gh api "repos/${REPO}/contents/${OLD_PATH}?ref=${HEAD}" --jq .sha)"
          gh api --method PUT "repos/${REPO}/contents/${OLD_PATH}" \
            -f message=":robot: keeps what the team already had" \
            -f content="$(base64 --wrap=0 merged.yaml)" \
            -f sha="${OLD_BLOB}" \
            -f branch="${BRANCH}" \
            > /dev/null

          if [ "${OLD_PATH}" != "${MANIFEST}" ]; then
            NEW_BLOB="$(gh api "repos/${REPO}/contents/${MANIFEST}?ref=${BRANCH}" --jq .sha)"
            gh api --method DELETE "repos/${REPO}/contents/${MANIFEST}" \
              -f message=":robot: keeps the team in its existing file" \
              -f sha="${NEW_BLOB}" \
              -f branch="${BRANCH}" \
              > /dev/null
          fi

          {
            echo '```diff'
            diff -u old.yaml merged.yaml || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Mark the pull request ready for review
        if: ${{ steps.read.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          OWNER: ${{ steps.inputs.outputs.owner }}
          NUMBER: ${{ steps.inputs.outputs.number }}
        run: gh pr ready "${NUMBER}" --repo "${OWNER}/org"

      - name: Report the failure on the tracking issue
        if: ${{ failure() && steps.eio-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.eio-token.outputs.token }}
          ISSUE: ${{ steps.inputs.outputs.issue }}
          PR: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "${ISSUE}" \
            --repo rancherlabs/eio \
            --body "🔴 Could not merge this request with what the team already has, so ${PR} stays a draft. If you're editing a team that isn't in the org repo yet, EIO needs to adopt it first. Details: ${RUN_URL}"
